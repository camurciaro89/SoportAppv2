version: "3.8"

# Fase 4 — Arquitectura:
# Flutter (HTTPS) → FastAPI → PostgreSQL
#                           → Ollama (IA local)

services:
  db:
    image: postgres:15-alpine
    container_name: soportapp_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soportapp2024}
      POSTGRES_DB: ${POSTGRES_DB:-soportapp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-soportapp}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - backend-network

  api:
    build: ./backend
    container_name: soportapp_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-soportapp2024}@db:5432/${POSTGRES_DB:-soportapp}
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-soportapp_super_secret_key_2024_secure_logic}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - backend-network

  proxy:
    build: ./backend/nginx
    container_name: soportapp_proxy
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - backend-network

  ollama:
    image: ollama/ollama:latest
    container_name: soportapp_ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - backend-network

  ollama-init:
    image: ollama/ollama:latest
    container_name: soportapp_ai_init
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: "sleep 8 && ollama pull ${OLLAMA_MODEL:-llama3}"
    networks:
      - backend-network
    restart: "no"

networks:
  backend-network:
    driver: bridge

volumes:
  postgres_data:
  ollama_data:
